name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.7.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Bump package version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::run a release from a branch"
            exit 1
          fi
          version="${RELEASE_VERSION#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "::error::invalid release version $RELEASE_VERSION"
              exit 1
              ;;
          esac
          if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists"
            exit 1
          fi
          sed -i "0,/^version = \".*\"$/s//version = \"$version\"/" Cargo.toml
          cargo check
      - name: Verify release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_id="$(cargo pkgid)"
          package_version="${package_id##*#}"
          package_version="${package_version##*@}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${RELEASE_VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ "$tag" != "v$package_version" ]; then
            echo "::error::tag $tag does not match package version $package_version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: make check
      - name: Commit and tag release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$version"
          fi
          git tag "v$version"
          git push --atomic origin "HEAD:$GITHUB_REF" "v$version"

  release:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            asset: linux_amd64
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux_arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build archive
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          cargo build --release --locked --target "$TARGET"
          binary="target/$TARGET/release/jkq"
          "$binary" --version
          "$binary" -b unused -t events -p 0 --check
          mkdir -p dist/package
          cp "$binary" dist/package/jkq
          archive="jkq_${ASSET}.tar.gz"
          tar -czf "dist/$archive" -C dist/package jkq
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          files: |
            dist/jkq_${{ matrix.asset }}.tar.gz
            dist/jkq_${{ matrix.asset }}.tar.gz.sha256
