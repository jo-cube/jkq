[package]
name = "jkq"
version = "0.21.2"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
jx = { git = "https://github.com/jo-cube/jx.git", tag = "v0.2.0" }
rdkafka = { version = "0.39.0", default-features = false, features = ["libz", "ssl-vendored", "zstd"] }
signal-hook = "0.4.4"
simd-json = "=0.17.3"
