name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_id="$(cargo pkgid)"
          package_version="${package_id##*#}"
          package_version="${package_version##*@}"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  release:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            asset: linux_amd64
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux_arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      - name: Build archive
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          cargo build --release --locked --target "$TARGET"
          binary="target/$TARGET/release/jkq"
          "$binary" --version
          "$binary" -b unused -t events -p 0 --check
          mkdir -p dist/package
          cp "$binary" dist/package/jkq
          archive="jkq_${ASSET}.tar.gz"
          tar -czf "dist/$archive" -C dist/package jkq
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/jkq_${{ matrix.asset }}.tar.gz
            dist/jkq_${{ matrix.asset }}.tar.gz.sha256
